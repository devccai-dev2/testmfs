<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Statement Table Extractor</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>PDF Statement Table Extractor</h1>
        <p>
          Upload a statement PDF (like bKash) to extract structured columns and rows.
          The tool renders a detected table and lets you download a CSV.
        </p>
      </header>

      <section class="panel">
        <label class="file-input">
          <span>Select PDF</span>
          <input id="pdf-input" type="file" accept="application/pdf" />
        </label>
        <button id="extract-btn" type="button" disabled>Extract Table</button>
        <button id="download-btn" type="button" disabled>Download CSV</button>
      </section>

      <section class="status" id="status">Waiting for PDF…</section>

      <section class="table-section">
        <table id="data-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.2.67/pdf.min.js" integrity="sha512-8/cNCLQ3B1O1VvK5Yg2CtOu3oImnE7+F8d0VQoe8dJh1BS8oJ4FRk3Zlz+oP3w6C1m2K34SRbTvmgP7oG5E0NQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="app.js"></script>
  </body>
</html>
